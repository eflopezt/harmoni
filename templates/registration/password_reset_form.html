<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — Harmoni</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="apple-touch-icon" sizes="192x192" href="{% static 'images/icon-192.png' %}">
    <meta name="theme-color" content="#0f766e">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/harmoni.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo" style="text-align:center;margin-bottom:24px;">
            <img src="{% static 'images/brand/png/harmoni-logo-400.png' %}"
                 alt="Harmoni"
                 style="max-width:220px;width:100%;height:auto;display:inline-block;margin-bottom:10px;">
            <p style="color:#475569;margin:0;">Recuperar contraseña</p>
        </div>

        <p class="text-muted text-center mb-4 small">
            Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="form-label">
                    <i class="fas fa-envelope me-1 text-muted"></i> Correo electrónico
                </label>
                <input type="email" name="email" id="id_email"
                       class="form-control" placeholder="tu@correo.com"
                       required autofocus autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="fas fa-paper-plane me-2"></i>Enviar enlace de recuperación
            </button>
        </form>

        <div class="auth-links mt-3 text-center">
            <a href="{% url 'login' %}" class="text-muted">
                <i class="fas fa-arrow-left me-1"></i>Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
