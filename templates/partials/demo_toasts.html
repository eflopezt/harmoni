{# Toast notifications "vivas" en el demo — aparecen al entrar.
   Hace el sistema sentir activo, no estático. #}
{% if DEMO_MODE and user.is_authenticated %}

<!-- Container -->
<div id="demo-toasts" style="position:fixed;top:80px;right:20px;z-index:9997;display:flex;flex-direction:column;gap:10px;max-width:340px;"></div>

<style>
.demo-toast {
    background: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    border-left: 4px solid;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transform: translateX(400px);
    opacity: 0;
    transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .3s;
}
.demo-toast.show { transform: translateX(0); opacity: 1; }
.demo-toast-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .9rem;
    flex-shrink: 0;
}
.demo-toast-body { flex: 1; }
.demo-toast-title { font-weight: 700; color: #0d2b27; font-size: .88rem; line-height: 1.3; }
.demo-toast-desc { font-size: .78rem; color: #64748b; margin-top: 2px; line-height: 1.4; }
.demo-toast-close {
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 1rem;
    padding: 0 4px;
}
</style>

<script>
(function(){
  const toasts = [
    {
      severity: 'high',
      icon: 'fa-file-contract',
      color: '#dc2626',
      title: '3 contratos por vencer',
      desc: 'Esta semana se vencen contratos de Carlos, María y Roberto. <a href="/contratos/" style="color:#0f766e;font-weight:600;">Ver ahora →</a>',
      delay: 1500,
      duration: 9000,
    },
    {
      severity: 'medium',
      icon: 'fa-pulse',
      color: '#f59e0b',
      title: 'EDO Vinos pide atención',
      desc: 'Pulse semanal bajó a 6.2/10. <a href="/empresas/pulse/" style="color:#0f766e;font-weight:600;">Ver Pulse →</a>',
      delay: 3500,
      duration: 9000,
    },
    {
      severity: 'low',
      icon: 'fa-rocket',
      color: '#16a34a',
      title: 'Nuevo candidato top',
      desc: 'Postulación score 94/100 para Sushiman. <a href="/reclutamiento/pipeline/" style="color:#0f766e;font-weight:600;">Pipeline →</a>',
      delay: 5500,
      duration: 9000,
    },
  ];

  function showToast(t){
    const container = document.getElementById('demo-toasts');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'demo-toast';
    el.style.borderLeftColor = t.color;
    el.innerHTML = `
      <div class="demo-toast-icon" style="background:${t.color}1a;color:${t.color};">
        <i class="fas ${t.icon}"></i>
      </div>
      <div class="demo-toast-body">
        <div class="demo-toast-title">${t.title}</div>
        <div class="demo-toast-desc">${t.desc}</div>
      </div>
      <button class="demo-toast-close" onclick="this.parentElement.classList.remove('show'); setTimeout(()=>this.parentElement.remove(),400);">×</button>
    `;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    if (t.duration) {
      setTimeout(() => {
        if (el.parentElement) {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 400);
        }
      }, t.duration);
    }
  }

  // Solo mostrar en /home, una vez por session
  const path = window.location.pathname;
  if (path === '/' && !sessionStorage.getItem('toasts_shown')) {
    sessionStorage.setItem('toasts_shown', '1');
    toasts.forEach(t => setTimeout(() => showToast(t), t.delay));
  }
})();
</script>
{% endif %}
