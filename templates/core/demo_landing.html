{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Harmoni — Elige un escenario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
      min-height: 100vh; color: #0d2b27;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .wrap { max-width: 880px; width: 100%; }
    .head { text-align: center; color: #fff; margin-bottom: 28px; }
    .head .logo { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
    .head p { opacity: .85; margin-top: 6px; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border-radius: 14px; padding: 22px; text-decoration: none;
      color: inherit; display: flex; flex-direction: column; gap: 8px;
      border: 2px solid transparent; transition: transform .12s, border-color .12s;
    }
    .card:hover { transform: translateY(-3px); border-color: #5eead4; }
    .card .ico {
      width: 48px; height: 48px; border-radius: 12px; background: #f0fdfa;
      color: #0f766e; display: flex; align-items: center; justify-content: center;
      font-size: 20px; margin-bottom: 4px;
    }
    .card h3 { font-size: 17px; font-weight: 700; }
    .card p { font-size: 13px; color: #64748b; line-height: 1.5; }
    .card .go { margin-top: auto; color: #0f766e; font-weight: 600; font-size: 13px; padding-top: 8px; }
    .foot { text-align: center; color: #fff; opacity: .7; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">Harmoni</div>
      <p>Elige un escenario para explorar la demo. Cada uno entra con un clic.</p>
    </div>
    <div class="grid">
      {% for e in escenarios %}
      <a class="card" href="/d/{{ e.slug }}/">
        <div class="ico"><i class="fas {{ e.icon }}"></i></div>
        <h3>{{ e.label }}</h3>
        <p>{{ e.sub }}</p>
        <span class="go">Entrar <i class="fas fa-arrow-right"></i></span>
      </a>
      {% endfor %}
    </div>
    <div class="foot">Ambiente de demostración · datos ficticios</div>
  </div>
</body>
</html>
