# =============================================================================
# Harmoni ERP — Production Docker Compose (optimizado para VPS 4-8GB)
# PostgreSQL y Redis corren nativos en el host
# network_mode: host — containers comparten red del host
# =============================================================================

services:
  web:
    image: harmoni-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: harmoni-web
    restart: unless-stopped
    env_file: .env.production
    network_mode: host
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - /opt/harmoni/staticfiles:/app/staticfiles
      - /opt/harmoni/media:/app/media
      - /opt/harmoni/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; c=http.client.HTTPConnection('localhost',8000,timeout=5); c.request('GET','/health/'); r=c.getresponse(); exit(0 if r.status in (200,301,302) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --threads 2
        --worker-class gthread
        --max-requests 1000
        --max-requests-jitter 50
        --timeout 300
        --graceful-timeout 30
        --preload
        --access-logfile -
        --error-logfile -
        --log-level warning

  celery:
    image: harmoni-app:latest
    container_name: harmoni-celery
    restart: unless-stopped
    env_file: .env.production
    network_mode: host
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - /opt/harmoni/media:/app/media
      - /opt/harmoni/logs:/app/logs
      # backup_db_diario (03:30) corre AQUI — sin este mount los dumps
      # quedaban dentro del contenedor efimero y se perdian al recrear.
      - /opt/harmoni/backups:/opt/harmoni/backups
      # deploy/ esta en .dockerignore (para que .env.production jamas entre
      # a la imagen), asi que el script de backup se monta read-only.
      - /opt/harmoni/app/deploy/backup-db.sh:/app/deploy/backup-db.sh:ro
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=2
        --autoscale=4,1
        --max-tasks-per-child=100
        --max-memory-per-child=150000
        -Ofair
        --prefetch-multiplier=1
        --without-heartbeat
    depends_on:
      web:
        condition: service_healthy

  celery-beat:
    image: harmoni-app:latest
    container_name: harmoni-beat
    restart: unless-stopped
    env_file: .env.production
    network_mode: host
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - /opt/harmoni/logs:/app/logs
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 300
    depends_on:
      web:
        condition: service_healthy
