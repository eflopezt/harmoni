[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py

# Solo correr tests bien estructurados (paquetes tests/) en apps del ERP.
# deploy/ y scripts/ contienen scripts ad-hoc que requieren un servidor
# corriendo o BD seedeada y no son tests unitarios.
testpaths =
    asistencia/tests
    cierre/tests
    comunicaciones/tests
    core/tests
    disciplinaria/tests
    documentos/tests
    empresas/tests
    integraciones/tests
    nominas/tests
    personal/tests
    prestamos/tests
    reclutamiento/tests
    salarios/tests
    vacaciones/tests
    viaticos/tests
    workflows/tests

norecursedirs = .venv .git deploy scripts node_modules .claude/worktrees
